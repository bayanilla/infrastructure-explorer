name: Verify Pathfinder
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check --no-respect-gitignore pathfinder probe_server.py test_*.py tools
      - run: ruff format --check --no-respect-gitignore pathfinder probe_server.py test_*.py tools
      - run: python -m unittest
      - run: npm test
      - run: python tools/gen_limits.py --check
      - run: git diff --check
